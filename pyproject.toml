[project]
name = "spidey-sokoban"
version = "1.0.0"
description = "A Sokoban puzzle game for kids featuring Spidey and friends"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.5.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
