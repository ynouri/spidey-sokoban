# Simple script-based project configuration for uv
[project]
name = "spidey-sokoban"
version = "1.0.0"
description = "A Sokoban puzzle game for kids featuring Spidey and friends"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.5.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
